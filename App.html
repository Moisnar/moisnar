<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pad:16px;--dark:#126B45;--light:#DDF5E8;--ink:#10241b;--muted:#6b7c74;--soft:#F3FAF6;--line:#EEF3F0;--red:#D92D20;--redbg:#FBE4E4;--gray:#9aa8a1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#fff;color:var(--ink);font-family:'Manrope','Segoe UI',Arial,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
html[lang=ar] body{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none;width:100%}
img{display:block}
.ic{flex:none;display:block}
[dir=rtl] .ic.fx{transform:scaleX(-1)}
#app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#fff}
@media(min-width:600px){body{background:#EAF3EE;display:flex;align-items:center;justify-content:center;min-height:100vh}#app{height:min(calc(100dvh - 32px),932px);border-radius:36px;box-shadow:0 24px 70px rgba(18,107,69,.20)}}
.pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:env(safe-area-inset-top) var(--pad) 40px;background:#fff;scrollbar-width:none}
html[dir=rtl]{--d:-1}
.pg.a-push{animation:pgPush .22s cubic-bezier(.2,.8,.2,1)}
.pg.a-back{animation:pgBack .2s cubic-bezier(.2,.8,.2,1)}
.pg.a-tab{animation:pgTab .14s ease-out}
@keyframes pgPush{from{opacity:.4;transform:translateX(calc(var(--d,1)*22px))}to{opacity:1;transform:none}}
@keyframes pgBack{from{opacity:.4;transform:translateX(calc(var(--d,1)*-22px))}to{opacity:1;transform:none}}
@keyframes pgTab{from{opacity:.55}to{opacity:1}}
.pg::-webkit-scrollbar{display:none}
.pg.nav{padding-bottom:140px}
@keyframes spin{to{transform:rotate(360deg)}}
/* shared */
.circ{flex:none;width:44px;height:44px;border-radius:50%;background:var(--light);display:flex;align-items:center;justify-content:center;color:var(--dark)}
.hdr{display:flex;align-items:center;gap:12px;min-height:44px;margin-top:24px}
.hdr h1{flex:1;font-size:22px;font-weight:800}
html[lang=ar] .hdr h1{font-weight:700}
.hdr .sub{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.title{font-size:26px;font-weight:800;margin-top:20px}
html[lang=ar] .title{font-weight:700;font-size:28px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px calc(-1*var(--pad)) 0;padding:0 var(--pad);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 20px;border-radius:20px;background:var(--light);color:var(--dark);font-size:15px;font-weight:500;display:flex;align-items:center}
.chip.on{background:var(--dark);color:#fff}
.chip.sm{height:36px;padding:0 16px}
.btn{height:54px;border-radius:27px;background:var(--dark);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center}
.btn.light{background:var(--light);color:var(--dark)}
.btn.red{background:#B42318}
.btn.sm{height:50px;border-radius:25px;font-size:16px}
.btn.fit{width:auto;padding:0 30px}
.btn.dis{opacity:.5;pointer-events:none}
.sec{font-size:18px;font-weight:800}
html[lang=ar] .sec{font-weight:700}
/* home */
.homehd{display:flex;align-items:center;justify-content:space-between;margin-top:14px;height:44px}
.homehd img{width:150px;height:32px;margin-left:2px}
.bell{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--light);display:flex;align-items:center;justify-content:center;color:var(--dark)}
html[dir=ltr] .bell{margin-right:2px}
.srchrow{display:flex;gap:8px;margin-top:14px}
.srch{flex:1;height:48px;border:1.5px solid var(--light);border-radius:24px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;color:#8d9a94}
.srch svg{color:var(--dark)}
.fbtn{flex:none;width:48px;height:48px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center}
.sechd{display:flex;align-items:center;justify-content:space-between;margin-top:22px;min-height:32px}
.sechd h2{font-size:20px;font-weight:800}
html[lang=ar] .sechd h2{font-weight:700}
.sortbtn{font-size:15px;color:var(--dark);display:flex;align-items:center;gap:6px;height:32px}
.sortbtn.on{background:var(--light);padding:0 14px;border-radius:16px;font-size:14px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px 14px;margin-top:14px}
.card{cursor:pointer;min-width:0}
.cimg{position:relative;aspect-ratio:172/140;border-radius:20px;background:var(--light);display:flex;align-items:center;justify-content:center;color:var(--dark);overflow:hidden}
.cimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.heart{position:absolute;top:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--dark)}
.heart.on svg{fill:var(--dark)}
.cname{font-size:14px;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprice{font-size:15px;font-weight:800;color:var(--dark);margin-top:6px}
.cloc{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);margin-top:6px}
/* nav */
#nav{position:absolute;left:14px;right:14px;bottom:calc(35px + env(safe-area-inset-bottom));height:54px;border-radius:27px;background:#fff;box-shadow:0 2px 14px rgba(18,107,69,.15);display:flex;align-items:center;justify-content:space-around;z-index:30;padding:0 4px}
#nav.hide{display:none}
#nav button{width:52px;height:54px;display:flex;align-items:center;justify-content:center;color:var(--dark)}
#nav .fab{width:46px;height:46px;border-radius:50%;background:var(--dark);color:#fff;margin-top:-8px;box-shadow:0 0 0 6px rgba(221,245,232,.8)}
/* explore */
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.dir{height:240px;border-radius:28px;background:var(--dark);color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.dir .ib{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--dark);display:flex;align-items:center;justify-content:center}
.dir h3{font-size:22px;font-weight:800}
.dir p{font-size:13px;line-height:1.5;opacity:.85;margin-top:6px}
.dir .go{margin-top:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.xhead{display:flex;justify-content:space-between;align-items:flex-start;margin-top:24px}
.xhead .t{font-size:28px;font-weight:800}
html[lang=ar] .xhead .t{font-weight:700}
.xhead .s{font-size:14px;color:var(--muted);margin-top:4px}
/* account */
.pcard{position:relative;margin-top:16px;height:96px;border-radius:24px;background:var(--light);display:flex;align-items:center;gap:16px;padding:0 16px}
.av{flex:none;width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--dark);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.pcard .nm{font-size:20px;font-weight:800}
.pcard .uid{font-size:15px;color:#5f7469;margin-top:4px;direction:ltr;text-align:start}
html[lang=ar] .pcard .uid{text-align:right}
.pcard .edit{margin-inline-start:auto;height:44px;padding:0 20px;border-radius:22px;background:var(--dark);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center}
.row{display:flex;align-items:center;gap:14px;min-height:56px;border-bottom:1px solid #EEF5F1;width:100%}
.row .ib{flex:none;width:40px;height:40px;border-radius:12px;background:var(--light);display:flex;align-items:center;justify-content:center;color:var(--dark)}
.row .lb{flex:1;font-size:16px}
.row.red .ib{background:var(--redbg);color:#B42318}.row.red .lb{color:#B42318}
.row .chv{color:#8a9892}
/* forms */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.fld>label{font-size:13px;color:var(--muted);font-weight:500}
.inp{height:48px;border:1px solid var(--light);border-radius:16px;display:flex;align-items:center;padding:0 16px;font-size:15px;gap:8px;background:#fff;width:100%}
.inp input{height:100%}
.inp.ta{height:auto;align-items:flex-start;padding:14px 16px}
.inp textarea{resize:none;line-height:1.6}
.inp .ph{color:var(--gray)}
.inp .chv{margin-inline-start:auto;color:var(--dark)}
.inp::placeholder,input::placeholder,textarea::placeholder{color:var(--gray)}
.frm{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.frow{display:flex;gap:12px}
.info{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:var(--light);font-size:13px;line-height:1.5;color:#2f4a3d}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.ptitle b{font-size:16px}
.ptitle span{font-size:12px;color:var(--muted)}
.ptiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.tile{position:relative;aspect-ratio:1/1;max-height:96px;border-radius:18px;background:var(--light);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--dark)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.add{border:2px dashed rgba(18,107,69,.5);background:var(--soft);flex-direction:column;gap:4px;font-size:11px;font-weight:600;text-align:center}
.tile.empty{border:2px dashed var(--light);background:#F6FBF8;color:#A9D9C0}
.tile .rm{position:absolute;top:5px;inset-inline-start:5px;width:22px;height:22px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.tile .mn{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);padding:2px 8px;border-radius:9px;background:var(--dark);color:#fff;font-size:10px;font-weight:700;z-index:2}
.note{display:flex;align-items:center;gap:6px;font-size:12px;color:#4a5d54;margin-top:10px}
/* sheets & dialogs */
#ov{position:absolute;inset:0;z-index:50;display:none}
#ov.on{display:block}
.dim{position:absolute;inset:0;background:rgba(16,36,27,.55);animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:#fff;border-radius:32px 32px 0 0;padding:12px 20px calc(28px + env(safe-area-inset-bottom));animation:up .2s ease;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.handle{width:44px;height:5px;border-radius:3px;background:#D5E5DC;margin:0 auto 14px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.shead h3{flex:1;font-size:22px;font-weight:800}
html[lang=ar] .shead h3{font-weight:700}
.shead .sub{font-size:13px;color:var(--muted);margin-top:2px;font-weight:500}
.x36{flex:none;width:36px;height:36px;border-radius:50%;background:var(--light);color:var(--dark);display:flex;align-items:center;justify-content:center}
.dlg{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:#fff;border-radius:28px;padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:fadein .2s;max-height:90%;overflow:auto}
.dlg .ib{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dlg h3{font-size:20px;font-weight:800;margin-top:6px}
html[lang=ar] .dlg h3{font-weight:700}
.dlg p{font-size:14px;line-height:1.7;color:#4a5d54}
.dlg .two{display:flex;gap:10px;width:100%;margin-top:10px}
.dlg .two .btn{flex:1}
.opt{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:18px;border:1px solid var(--light);font-size:16px;width:100%}
.opt.on{background:var(--light);font-weight:700}
.opt .rd,.rd{flex:none;width:22px;height:22px;border:2px solid var(--dark);border-radius:50%;display:flex;align-items:center;justify-content:center}
.opt.on .rd::after,.rd.on::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--dark)}
.opt .lb{flex:1}
.opts{display:flex;flex-direction:column;gap:8px}
/* product page */
.hero{position:absolute;left:0;right:0;top:0;height:300px;border-radius:0 0 32px 32px;overflow:hidden;background:var(--light)}
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;color:var(--dark);position:relative;cursor:zoom-in}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hbtn{position:absolute;top:calc(24px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:var(--dark);z-index:3}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.dots i{width:6px;height:6px;border-radius:3px;background:#fff;transition:.2s}
.dots i.on{width:22px;background:var(--dark)}
.cnt{position:absolute;bottom:30px;inset-inline-end:16px;padding:4px 12px;border-radius:14px;background:rgba(16,36,27,.6);color:#fff;font-size:12px;z-index:3}
.pinfo{padding-top:318px;display:flex;flex-direction:column;gap:14px;padding-bottom:114px}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ptop h1{font-size:22px;font-weight:800}
html[lang=ar] .ptop h1{font-weight:700}
.ptop .pr{font-size:22px;font-weight:800;color:var(--dark);white-space:nowrap}
.pchips{display:flex;gap:8px;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--light);font-size:14px;color:var(--dark);font-weight:500}
.blk b{display:block;font-size:16px;font-weight:800;margin-bottom:6px}
html[lang=ar] .blk b{font-weight:700}
.blk p{font-size:14px;line-height:1.7;color:#4a5d54}
.seller{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:var(--light)}
.seller .av{width:52px;height:52px}
.seller small{display:block;font-size:12px;color:#4a5d54}
.seller strong{display:block;font-size:16px;font-weight:800;margin:3px 0}
.seller .loc{display:flex;align-items:center;gap:3px;font-size:12px;color:#4a5d54}
.cta{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:430px;bottom:0;height:100px;background:#fff;box-shadow:0 -4px 16px rgba(18,107,69,.10);padding:0 var(--pad) calc(24px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px;z-index:5}
.cta .btn{height:54px}
/* my products */
.mp{border:1px solid var(--light);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mp .top{display:flex;gap:12px;align-items:center;cursor:pointer}
.mp .im{flex:none;width:88px;height:88px;border-radius:16px;background:var(--light);display:flex;align-items:center;justify-content:center;color:var(--dark);position:relative;overflow:hidden}
.mp .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mp .nm{font-size:15px}.mp .pr{font-size:16px;font-weight:800;color:var(--dark);margin-top:5px}
.mp .mt{display:flex;align-items:center;gap:8px;margin-top:5px}
.mp .mt .l{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.pill{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;background:var(--light);color:var(--dark)}
.pill.g{background:#EEF0EF;color:var(--muted)}
.acts{display:flex;gap:8px}
.acts button{flex:1;height:40px;border-radius:20px;background:var(--light);color:var(--dark);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;white-space:nowrap}
.acts button.dk{background:var(--dark);color:#fff;flex:1.4}
.acts button.rd2{background:var(--redbg);color:#B42318}
/* lists */
.lst{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.item{display:flex;align-items:center;gap:12px;height:52px;padding:0 12px;border-radius:16px;width:100%}
.item.on{background:var(--light);font-weight:700}
.item .lb{flex:1;font-size:16px}
.item .cic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--light);display:flex;align-items:center;justify-content:center;color:var(--dark)}
.item.on .cic{background:#fff}
.item.tall{height:58px}
.item .sb{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.badge{flex:none;width:44px;height:36px;border-radius:18px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--dark)}
.item.on .badge{background:#fff}
.flag{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 .8px rgba(0,0,0,.12);background:var(--light);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--dark)}
.flag svg,.flag img{width:100%;height:100%;display:block}
.lh{height:32px;border-radius:10px;background:#EEF8F2;display:flex;align-items:center;padding:0 14px;font-size:15px;font-weight:800;color:var(--dark);margin:6px 0 2px}
.idx{position:absolute;inset-inline-end:max(2px,calc(var(--pad) - 14px));top:150px;display:flex;flex-direction:column;align-items:center;z-index:4}
.idx button{width:20px;height:19px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted)}
.idx button.on{background:var(--dark);color:#fff;border-radius:50%;height:20px}
.pickwrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 var(--pad)}
.pickwrap .scroll{flex:1;overflow-y:auto;margin:0 calc(-1*var(--pad));padding:0 var(--pad);scrollbar-width:none}
.pickwrap .scroll::-webkit-scrollbar{display:none}
.pickwrap .foot{padding:12px 0 calc(24px + env(safe-area-inset-bottom))}
.withidx .scroll{padding-inline-end:calc(var(--pad) + 14px)}
/* search */
.sbar{display:flex;align-items:center;gap:10px;margin-top:24px}
.sfield{flex:1;height:48px;border:1.5px solid var(--dark);border-radius:24px;display:flex;align-items:center;gap:8px;padding:0 14px}
.sfield.idle{border:1px solid var(--light)}
.hrow{display:flex;align-items:center;gap:12px;height:56px;border-bottom:1px solid #EEF3F0;width:100%}
.hrow .cl{flex:none;width:36px;height:36px;border-radius:50%;background:var(--light);color:var(--dark);display:flex;align-items:center;justify-content:center}
.hrow .lb{flex:1;font-size:16px}
.cntrow{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.cntrow b{font-size:16px}
.sortpill{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--light);font-size:14px;color:var(--dark);font-weight:500}
.fchip{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--dark);color:#fff;font-size:13px;font-weight:500}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}
.bigc{width:132px;height:132px;border-radius:50%;background:var(--light);display:flex;align-items:center;justify-content:center;color:var(--dark)}
.center h2{font-size:22px;font-weight:800;margin-top:26px}
html[lang=ar] .center h2{font-weight:700}
.center p{font-size:14px;line-height:1.8;color:var(--muted);margin-top:8px}
/* success */
.ring{width:156px;height:156px;border-radius:50%;background:var(--light);display:flex;align-items:center;justify-content:center}
.ring i{width:108px;height:108px;border-radius:50%;background:var(--dark);display:flex;align-items:center;justify-content:center;color:#fff}
.minip{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--light);border-radius:22px;width:100%;text-align:start}
.minip .im{flex:none;width:72px;height:72px;border-radius:16px;background:var(--light);display:flex;align-items:center;justify-content:center;color:var(--dark);position:relative;overflow:hidden}
.minip .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* settings, help, legal */
.srow{display:flex;align-items:center;gap:8px;height:52px;border-bottom:1px solid #EEF3F0;font-size:16px;width:100%}
.srow .v{font-size:14px;color:var(--muted)}
.srow .lb{flex:1}
.srow.red{color:#B42318}
.sgrp{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 4px}
.gbadge{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;background:var(--soft);border:1px solid var(--light);font-size:14px;font-weight:700}
.faq{border:1px solid var(--light);border-radius:20px;padding:14px 16px;width:100%;display:block}
.faq.on{background:var(--light)}
.faq .q{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.faq.on .q{font-weight:800}
.faq .q span{flex:1}
.faq .a{font-size:13px;line-height:1.7;color:#4a5d54;padding-top:10px}
.supp{margin-top:18px;border-radius:28px;background:var(--dark);color:#fff;padding:18px;display:flex;flex-direction:column;gap:12px}
.supp .t{display:flex;align-items:center;gap:12px}
.supp .t .ib{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--dark);display:flex;align-items:center;justify-content:center}
.supp .bt{text-decoration:none;height:46px;border-radius:23px;background:#fff;color:var(--dark);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center}
.keyb{display:flex;gap:12px;padding:16px;border-radius:22px;background:var(--light);margin-top:16px}
.keyb .ib{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--dark);display:flex;align-items:center;justify-content:center}
.keyb .kt{display:block;font-size:16px;color:var(--dark);font-weight:800}
.keyb .kx{display:block;font-size:14px;line-height:1.8;color:#2f4a3d;margin-top:4px}
.lsec{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.lsec .hh{display:flex;align-items:center;gap:10px}
.lsec .hh i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--light);color:var(--dark);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;font-style:normal}
.lsec .hh b{font-size:17px;font-weight:800}
.lsec .bd{display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.85;color:#3d4f46;padding-inline-start:38px}
.lsec ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.lsec li{display:flex;gap:8px}.lsec li::before{content:'';flex:none;width:6px;height:6px;border-radius:50%;background:var(--dark);margin-top:11px}
.lfoot{margin-top:22px;padding:14px 16px;border-radius:18px;border:1px solid var(--light);font-size:13px;line-height:1.8;color:#4a5d54;text-align:center}
/* viewer */
.viewer{position:absolute;inset:0;background:#0C1812;z-index:60;color:#fff}
.viewer .vm{position:absolute;left:0;right:0;top:130px;height:520px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.viewer .vm::-webkit-scrollbar{display:none}
.viewer .vs{flex:none;width:100%;height:100%;scroll-snap-align:start;background:var(--light);display:flex;align-items:center;justify-content:center;color:var(--dark);position:relative}
.viewer .vs img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0C1812}
.viewer .th{position:absolute;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}
.viewer .th div{width:64px;height:64px;border-radius:14px;background:var(--light);opacity:.6;border:2.5px solid transparent;display:flex;align-items:center;justify-content:center;color:var(--dark);overflow:hidden;position:relative}
.viewer .th div.on{opacity:1;border-color:#fff}
.viewer .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* splash */
#splash{position:absolute;inset:0;background:#153220;z-index:100;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
#splash img{width:160px;height:auto}
#splash.out{opacity:0;pointer-events:none}
/* toast */
.toast{position:absolute;left:24px;right:24px;bottom:120px;padding:12px 16px;border-radius:16px;background:#10241b;color:#fff;font-size:14px;text-align:center;z-index:90;animation:fadein .2s}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== tablet / iPad / large screens: fill the whole screen ===== */
@media(min-width:600px){
 :root{--pad:max(28px,calc((100vw - 1120px)/2))}
 body{background:#fff;display:block;min-height:0}
 #app{max-width:none;width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;margin:0}
 .pg.n{--pad:max(24px,calc((100vw - 680px)/2))}
 .grid{grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:22px 18px}
 .dirs{grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:16px;min-height:max(520px,calc(100dvh - 420px))}
 .dir{height:auto;min-height:230px;padding:22px}
 .dir .ib{width:64px;height:64px}
 .dir h3{font-size:28px}
 .dir p{font-size:15px}
 .homehd img{width:170px;height:36px;margin-left:2.2px}
 .srch,.fbtn{height:52px}.fbtn{width:52px}
 html[dir=ltr] .bell{margin-right:4px}
 #nav{left:50%;right:auto;width:min(520px,calc(100% - 28px));transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom))}
 .sheet{left:50%;right:auto;width:min(560px,100%);transform:translateX(-50%);animation:upc .2s ease}
 @keyframes upc{from{transform:translate(-50%,24px);opacity:.6}to{transform:translateX(-50%);opacity:1}}
 .dlg{left:50%;right:auto;width:min(440px,calc(100% - 48px));transform:translate(-50%,-50%)}
 .hero{height:380px}
 .pinfo{padding-top:400px;padding-inline:max(24px,calc((100vw - 760px)/2))!important}
 .cta{max-width:none;padding-inline:max(24px,calc((100vw - 760px)/2))}
 .viewer .vm{top:110px;height:auto;bottom:170px}
 .viewer .th{bottom:calc(60px + env(safe-area-inset-bottom))}
 .pg.nav{padding-bottom:130px}
 .card{max-width:none}
}

#view{position:absolute;inset:0}
.hrow{display:flex;align-items:center;gap:12px;height:56px;border-bottom:1px solid #EEF3F0;width:100%}
.hrow .cl{flex:none;width:36px;height:36px;border-radius:50%;background:var(--light);color:var(--dark);display:flex;align-items:center;justify-content:center}
.hrow .lb{flex:1;font-size:16px;text-align:start}

</style>

const LEGAL={"terms": {"title": {"ar": "شروط الاستخدام", "en": "Terms of Use"}, "upd": {"ar": "آخر تحديث: 2026/10/13", "en": "Last updated: 2026/10/13"}, "key": {"title": {"ar": "MOISNAR وسيط عرض فقط", "en": "MOISNAR is a listing intermediary only"}, "text": {"ar": "MOISNAR منصة تعرض المنتجات وتربط البائع بالمشتري. هو <b>ليس بائعًا ولا مشتريًا</b>، ولا يتدخل في الصفقة، ولا يقدّم أي خدمة <b>دفع أو شحن أو ضمان</b>.", "en": "MOISNAR is a platform that lists products and connects sellers with buyers. It is <b>neither a seller nor a buyer</b>, does not interfere in the deal, and does not provide any <b>payment, shipping or guarantee service</b>."}}, "sections": [{"title": {"ar": "التعريف بالمنصة", "en": "About the platform"}, "items": [{"ar": "MOISNAR منصة تتيح للبائعين نشر منتجاتهم، وللمشترين البحث عنها والتواصل مع البائع مباشرة. باستخدامك التطبيق فإنك توافق على هذه الشروط.", "en": "MOISNAR is a platform that lets sellers post their products and lets buyers search for them and contact the seller directly. By using the app, you agree to these terms."}]}, {"title": {"ar": "دور MOISNAR", "en": "The role of MOISNAR"}, "items": [{"ar": "دور MOISNAR هو توفير المنصة، وتنظيم المنتجات، ومساعدة المشتري على العثور على البائع. وهو لا يملك المنتجات المعروضة، ولا يشتريها ولا يبيعها نيابة عن أحد، ولا يخزّنها ولا يشحنها.", "en": "MOISNAR's role is to provide the platform, organize products, and help buyers find the seller. It does not own the listed products, does not buy or sell them on anyone's behalf, and does not store or ship them."}]}, {"title": {"ar": "لا توجد خدمات دفع", "en": "No payment services"}, "items": [{"ar": "لا يوجد في MOISNAR دفع داخل التطبيق، ولا محفظة إلكترونية، ولا تحويل أموال، ولا نظام ضمان (Escrow). أي دفع يتم <b>مباشرة بين البائع والمشتري خارج المنصة</b> وعلى مسؤوليتهما وحدهما.", "en": "MOISNAR has no in-app payment, no e-wallet, no money transfers, and no escrow system. Any payment is made <b>directly between the seller and the buyer outside the platform</b> and at their sole responsibility."}]}, {"title": {"ar": "الصفقة بين الطرفين", "en": "The deal between the parties"}, "items": [{"ar": "يتفق البائع والمشتري بأنفسهما على:", "en": "The seller and buyer agree on the following themselves:"}, [{"ar": "السعر النهائي والكمية.", "en": "The final price and quantity."}, {"ar": "طريقة الدفع.", "en": "The payment method."}, {"ar": "الشحن ومكان وموعد التسليم.", "en": "Shipping, and the place and time of delivery."}, {"ar": "أي شروط أخرى.", "en": "Any other terms."}], {"ar": "ولا يكون MOISNAR طرفًا في أي اتفاق أو نزاع بينهما.", "en": "MOISNAR is not a party to any agreement or dispute between them."}]}, {"title": {"ar": "الحساب وتسجيل الدخول", "en": "Account and login"}, "items": [{"ar": "يتم التسجيل عبر حساب Google أو X. أنت مسؤول عن حسابك وعن صحة المعلومات التي تضيفها. يحصل كل حساب على رقم تعريف فريد (UID). تفاصيل المنتج ووسائل التواصل لا تظهر إلا للمستخدم المسجّل.", "en": "You sign up with a Google or X account. You are responsible for your account and the accuracy of the information you add. Each account gets a unique ID (UID). Product details and contact methods are only visible to logged-in users."}]}, {"title": {"ar": "التزامات البائع", "en": "Seller's obligations"}, "items": [[{"ar": "نشر معلومات وصور حقيقية وسعر وكمية صحيحين للمنتج.", "en": "Post real information and photos, and a correct price and quantity for the product."}, {"ar": "إضافة وسيلة تواصل واحدة على الأقل (هاتف أو بريد) في الإعدادات.", "en": "Add at least one contact method (phone or email) in Settings."}, {"ar": "تحديث حالة المنتج إلى \"تم البيع\" عند بيعه، أو حذفه.", "en": "Update the product status to \"Sold\" once it is sold, or delete it."}, {"ar": "عدم نشر محتوى مخالف أو مضلّل.", "en": "Do not post violating or misleading content."}]]}, {"title": {"ar": "المنتجات الممنوعة", "en": "Prohibited products"}, "items": [{"ar": "يُمنع نشر المنتجات المخالفة للقانون أو المسروقة أو المقلّدة، والأسلحة والمخدرات والمواد الخطرة، وأي محتوى مسيء أو مضلّل. ويحق لـ MOISNAR حذف أي منتج مخالف.", "en": "Posting illegal, stolen or counterfeit products, weapons, drugs, hazardous materials, and any offensive or misleading content is prohibited. MOISNAR may remove any violating product."}]}, {"title": {"ar": "التزامات المشتري", "en": "Buyer's obligations"}, "items": [[{"ar": "التحقق من المنتج والبائع قبل الدفع، ويُفضّل معاينة المنتج.", "en": "Verify the product and the seller before paying, and inspect the product if possible."}, {"ar": "الحذر من دفع مبالغ مقدّمة لأشخاص لا تعرفهم.", "en": "Be careful about paying advance amounts to people you do not know."}, {"ar": "استخدام وسائل التواصل لغرض الشراء فقط، وعدم إرسال رسائل مزعجة.", "en": "Use contact methods for buying purposes only, and do not send spam."}]]}, {"title": {"ar": "الإبلاغ والإجراءات", "en": "Reporting and actions"}, "items": [{"ar": "يمكنك الإبلاغ عن أي منتج أو حساب مخالف. تراجع إدارة المنصة البلاغات، ويحق لها حذف المنتج أو تعليق الحساب عند المخالفة دون إشعار مسبق.", "en": "You can report any violating product or account. The platform administration reviews reports and may remove the product or suspend the account in case of violation, without prior notice."}]}, {"title": {"ar": "إخلاء المسؤولية", "en": "Disclaimer"}, "items": [{"ar": "لا يضمن MOISNAR جودة أو صحة أو توفّر أي منتج، ولا هوية أو مصداقية أي مستخدم. ولا يتحمل أي خسارة أو ضرر ينتج عن التعامل بين المستخدمين، أو عن الدفع أو الشحن أو التسليم أو المنتج نفسه.", "en": "MOISNAR does not guarantee the quality, accuracy or availability of any product, nor the identity or credibility of any user. It is not liable for any loss or damage arising from dealings between users, or from payment, shipping, delivery or the product itself."}]}, {"title": {"ar": "المحتوى والصور", "en": "Content and photos"}, "items": [{"ar": "تبقى منتجاتك وصورك ملكًا لك، وتمنح MOISNAR إذنًا بعرضها داخل المنصة وتحسين جودة الصور تلقائيًا لتظهر بوضوح.", "en": "Your products and photos remain yours, and you grant MOISNAR permission to display them within the platform and to automatically enhance photo quality so they look sharp."}]}, {"title": {"ar": "تعديل الشروط", "en": "Changes to the terms"}, "items": [{"ar": "يحق لـ MOISNAR تعديل هذه الشروط في أي وقت، واستمرارك في استخدام التطبيق بعد التعديل يعني موافقتك عليها.", "en": "MOISNAR may change these terms at any time, and continuing to use the app after a change means you accept them."}]}], "foot": {"ar": "للاستفسار عن هذه الشروط تواصل معنا من <b>الإعدادات ← المساعدة والدعم</b>.", "en": "For questions about these terms, contact us from <b>Settings → Help & Support</b>."}}, "privacy": {"title": {"ar": "سياسة الخصوصية", "en": "Privacy Policy"}, "upd": {"ar": "آخر تحديث: 2026/10/13", "en": "Last updated: 2026/10/13"}, "key": {"title": {"ar": "خصوصيتك تهمنا", "en": "Your privacy matters"}, "text": {"ar": "MOISNAR لا يبيع بياناتك. وبما أنه <b>وسيط عرض فقط</b> ولا يقدّم خدمات دفع، فهو لا يجمع ولا يعالج أي بيانات بطاقات أو حسابات بنكية.", "en": "MOISNAR does not sell your data. Since it is <b>a listing intermediary only</b> and does not provide payment services, it does not collect or process any card or bank account data."}}, "sections": [{"title": {"ar": "البيانات التي نجمعها", "en": "Data we collect"}, "items": [[{"ar": "بيانات حسابك من Google أو X (الاسم والبريد أو المعرّف والصورة إن وُجدت).", "en": "Your account data from Google or X (name, email or handle, and photo if available)."}, {"ar": "رقم التعريف الفريد (UID) الذي نولّده لحسابك.", "en": "The unique ID (UID) we generate for your account."}, {"ar": "وسائل التواصل التي تضيفها بنفسك (رقم الهاتف أو البريد).", "en": "The contact methods you add yourself (phone number or email)."}, {"ar": "بيانات المنتجات التي تنشرها: الصور والاسم والسعر والكمية والوصف والدولة والمحافظة.", "en": "The data of products you post: photos, name, price, quantity, description, country and governorate."}, {"ar": "منتجاتك المفضلة، وبيانات استخدام أساسية لتحسين التطبيق.", "en": "Your favorite products, and basic usage data to improve the app."}]]}, {"title": {"ar": "ما لا نجمعه", "en": "What we do not collect"}, "items": [{"ar": "لا نجمع بيانات بطاقات الدفع أو الحسابات البنكية، ولا نعالج أي مدفوعات، لأن الدفع يتم بين البائع والمشتري خارج المنصة.", "en": "We do not collect payment card or bank account data, and we do not process any payments, because payment takes place between the seller and the buyer outside the platform."}]}, {"title": {"ar": "كيف نستخدم بياناتك", "en": "How we use your data"}, "items": [[{"ar": "تشغيل المنصة وعرض منتجاتك للمشترين.", "en": "Running the platform and showing your products to buyers."}, {"ar": "تمكين المشتري من التواصل معك مباشرة.", "en": "Letting buyers contact you directly."}, {"ar": "تحسين جودة الصور تلقائيًا.", "en": "Automatically improving photo quality."}, {"ar": "مراجعة البلاغات وحماية المستخدمين من الاحتيال والإساءة.", "en": "Reviewing reports and protecting users from fraud and abuse."}, {"ar": "إرسال إشعارات تخص حسابك ومنتجاتك.", "en": "Sending notifications about your account and products."}]]}, {"title": {"ar": "من يرى معلوماتك؟", "en": "Who sees your information?"}, "items": [{"ar": "<b>وسائل التواصل</b> (الهاتف والبريد) تظهر فقط للمستخدمين المسجّلين عند فتح منتجك أو ملفك، ولا تظهر للزائر غير المسجّل. أما الاسم وUID والمكان ومنتجاتك فتظهر في ملفك الشخصي.", "en": "<b>Contact methods</b> (phone and email) are only shown to logged-in users when they open your product or profile, and are not shown to guests who are not logged in. Your name, UID, location and products appear on your profile."}]}, {"title": {"ar": "المشاركة مع الغير", "en": "Sharing with others"}, "items": [{"ar": "لا نبيع بياناتك ولا نشاركها مع أحد، إلا مزوّدي الخدمات التقنية اللازمين لتشغيل التطبيق (مثل الاستضافة)، أو عند وجود إلزام قانوني.", "en": "We do not sell your data or share it with anyone, except the technical service providers needed to run the app (such as hosting), or when legally required."}]}, {"title": {"ar": "أذونات الجهاز", "en": "Device permissions"}, "items": [{"ar": "نطلب إذن الكاميرا والصور فقط عند إضافة صور المنتج، ولا نستخدمهما لغير ذلك. ويمكنك إلغاء الإذن في أي وقت من إعدادات هاتفك.", "en": "We ask for camera and photo permission only when you add product photos, and we do not use them for anything else. You can revoke the permission at any time from your phone settings."}]}, {"title": {"ar": "حقوقك", "en": "Your rights"}, "items": [[{"ar": "تعديل وسائل التواصل ومعلومات ملفك من الإعدادات.", "en": "Edit your contact methods and profile information from Settings."}, {"ar": "تعديل منتجاتك أو حذفها في أي وقت.", "en": "Edit or delete your products at any time."}, {"ar": "طلب حذف حسابك نهائيًا.", "en": "Request permanent deletion of your account."}]]}, {"title": {"ar": "الاحتفاظ والحذف", "en": "Retention and deletion"}, "items": [{"ar": "عند حذف حسابك نحذف بياناتك ومنتجاتك خلال مدة معقولة، مع الاحتفاظ بما يلزم قانونيًا أو لحماية المنصة.", "en": "When you delete your account, we delete your data and products within a reasonable time, keeping only what is legally required or needed to protect the platform."}]}, {"title": {"ar": "تنبيه عند التواصل", "en": "A note when contacting"}, "items": [{"ar": "يتم التواصل بين المستخدمين خارج MOISNAR، فلا تشارك مع أي شخص بيانات حساسة مثل بيانات البطاقات أو كلمات المرور أو رموز التحقق.", "en": "Communication between users takes place outside MOISNAR, so do not share sensitive data such as card details, passwords or verification codes with anyone."}]}, {"title": {"ar": "الأمان والتعديلات", "en": "Security and updates"}, "items": [{"ar": "نتخذ إجراءات معقولة لحماية بياناتك، لكن لا يمكن ضمان حماية مطلقة. وقد نحدّث هذه السياسة، وسنعرض لك التحديثات المهمة في التطبيق.", "en": "We take reasonable measures to protect your data, but absolute protection cannot be guaranteed. We may update this policy, and we will show you important updates in the app."}]}], "foot": {"ar": "لأي استفسار عن خصوصيتك تواصل معنا من <b>الإعدادات ← المساعدة والدعم</b>.", "en": "For any question about your privacy, contact us from <b>Settings → Help & Support</b>."}}};

function patchNode(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
 if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
 [...a.attributes].forEach(at=>{if(!b.hasAttribute(at.name))a.removeAttribute(at.name)});
 [...b.attributes].forEach(at=>{if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value)});
 const ac=[...a.childNodes],bc=[...b.childNodes],n=Math.max(ac.length,bc.length);
 for(let i=0;i<n;i++){if(!ac[i])a.appendChild(bc[i].cloneNode(true));else if(!bc[i])ac[i].remove();else patchNode(ac[i],bc[i])}}

 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px"><span class="sec">${t('recent')}</span><button style="font-size:14px;font-weight:500;color:var(--dark)" data-a="clearHist">${t('clear_all')}</button></div>
 <div style="margin-top:6px">${state.hist.map((h,i)=>`<div class="hrow"><button class="cl" data-a="histGo" data-v="${esc(h)}">${ic('clock',20)}</button><button class="lb" data-a="histGo" data-v="${esc(h)}">${esc(h)}</button><button data-a="histGo" data-v="${esc(h)}" style="color:#8a9892">${ic('upleft',20,{w:2})}</button></div>`).join('')}</div></div>`});
function applyFilters(a){const f=state.filt;if(f.cat!=='all')a=a.filter(p=>p.cat===f.cat);if(f.min!=='')a=a.filter(p=>p.price>=+f.min);if(f.max!=='')a=a.filter(p=>p.price<=+f.max);
 if(f.country)a=a.filter(p=>p.country===f.country);if(f.gov!==null&&f.gov!==undefined&&f.country)a=a.filter(p=>p.gov===f.gov);if(f.cond!=='all')a=a.filter(p=>p.cond===f.cond);return a}
function filtChips(){const f=state.filt,c=[];if(f.cat!=='all')c.push(['cat',catn(f.cat)]);if(f.min!==''||f.max!=='')c.push(['price',`${f.min||0} - ${f.max||'∞'}`]);if(f.country)c.push(['country',f.gov!=null?govn(f.country,f.gov):cname(f.country)]);if(f.cond!=='all')c.push(['cond',t(f.cond)]);return c}
SCREENS.results=()=>{const q=state.q.trim().toLowerCase();let a=active().filter(p=>!q||(p.en+' '+p.ar+' '+(p.name||'')).toLowerCase().includes(q));a=sortList(applyFilters(a));const fc=filtChips();
 return {nav:'home',html:`<div class="pg nav"><div class="sbar">${backBtn()}<button class="sfield idle" data-a="goSearch" style="text-align:start">${ic('search',20,{w:2})}<span style="flex:1">${esc(state.q)||`<span style="color:var(--gray)">${t('search_ph')}</span>`}</span></button><button class="fbtn" data-a="filters">${ic('filter',22,{c:'#fff',w:2})}</button></div>
 ${fc.length?`<div class="chips">${fc.map(c=>`<button class="fchip" data-a="rmfilt" data-v="${c[0]}">${esc(c[1])}${ic('x',12,{w:2.6})}</button>`).join('')}<button style="flex:none;font-size:13px;font-weight:700;color:var(--dark);padding:0 4px" data-a="clearFilt">${t('clear_all')}</button></div>`:''}
 <div class="cntrow"><b>${a.length} ${t('results')}</b><button class="sortpill" data-a="sortSheet">${t({newest:'newest',oldest:'oldest',cheap:'cheapest_first',exp:'expensive_first'}[state.sort])}${ic('chevd',14,{w:2.4})}</button></div>
 ${a.length?grid(a):empty('search',t('no_results'),t('no_results_d'),`<button class="btn sm fit" style="margin-top:24px;background:var(--light);color:var(--dark)" data-a="clearFilt">${t('clear_filters')}</button>`).replace('margin-top:210px','margin-top:120px')}</div>`}};
/* product page */
function slidesHtml(p){const n=p.imgs&&p.imgs.length?p.imgs.length:(p.n||1);return Array.from({length:n},(_,i)=>`<div class="slide" data-a="viewer" data-id="${esc(p.id)}" data-v="${i}">${p.imgs&&p.imgs[i]?`<img src="${esc(p.imgs[i])}" alt="">`:ic('image',64,{w:1.6})}</div>`).join('')}
SCREENS.prod=pr=>{const p=byId(pr.id);if(!p)return {nav:null,html:'<div class="pg"></div>'};const n=p.imgs&&p.imgs.length?p.imgs.length:(p.n||1);
 const mine=p.mine;const desc=p.desc||t('product_desc_demo');
 return {nav:null,after:v=>{const s=$('.slides',v),c=$('.cnt',v),ds=$$('.dots i',v);if(s)s.addEventListener('scroll',()=>{const i=Math.round(s.scrollLeft/s.clientWidth*(L()==='ar'?-1:1));const k=Math.max(0,Math.min(n-1,i));c.textContent=lt((k+1)+'/'+n);ds.forEach((d,j)=>d.classList.toggle('on',j===k))})},
 html:`<div class="pg" style="padding:0"><div class="hero"><div class="slides">${slidesHtml(p)}</div><div class="dots">${Array.from({length:n},(_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div><div class="cnt">${lt('1/'+n)}</div></div>
 <button class="hbtn" style="inset-inline-start:16px" data-a="back">${ic('back',20,{w:2.2})}</button>
 ${mine?`<span class="hbtn" style="inset-inline-end:16px;width:auto;padding:0 16px;gap:8px;font-size:14px;font-weight:800;border-radius:22px"><i style="width:9px;height:9px;border-radius:50%;background:${p.status==='active'?'#22A559':'#9aa8a1'}"></i>${p.status==='active'?t('active'):t('sold_s')}</span>`:
 `<div style="position:absolute;inset-inline-end:16px;top:calc(24px + env(safe-area-inset-top));display:flex;gap:8px;z-index:3"><button class="hbtn" style="position:static" data-a="fav" data-id="${esc(p.id)}" id="pheart">${ic('heart',22,{f:isFav(p.id)?'currentColor':'none'})}</button><button class="hbtn" style="position:static" data-a="reportSheet">${ic('warn',22,{c:'#B42318',w:1.9})}</button></div>`}
 <div class="pinfo" style="padding-inline:var(--pad)"><div class="ptop"><h1>${esc(pn(p))}</h1><span class="pr">${money(p.price)}</span></div>
 <div class="pchips"><span class="pchip">${ic('pin',16)}${esc(locFull(p))}</span><span class="pchip">${ic('box',16)}${t('qty_label')}: ${p.qty}</span></div>
 <div class="blk"><b>${t('description')}</b><p>${esc(desc)}</p></div>${p.notes?`<div class="blk"><b>${t('notes')}</b><p>${esc(p.notes)}</p></div>`:`<div class="blk"><b>${t('notes')}</b><p>${t('notes_demo')}</p></div>`}
 <div class="seller"><div class="av">${ic('person',28)}</div><div style="flex:1"><small>${mine?t('seller_you'):t('seller')}</small><strong>${esc(mine&&state.prof.name?state.prof.name:t('seller_name'))}</strong><span class="loc">${ic('pin',14)}${esc(locFull(p))}</span></div>${ic('chev',20,{c:'#8a9892',w:2})}</div></div>
 <div class="cta">${mine?(p.status==='active'?`<button class="btn" style="flex:1.5;font-size:15px" data-a="soldq" data-id="${esc(p.id)}">${ic('check',20,{c:'#fff',w:2})}${t('mark_sold')}</button><button class="btn light" style="flex:1.1;font-size:15px" data-a="editp" data-id="${esc(p.id)}">${ic('pen',20,{w:2})}${t('edit')}</button><button class="btn" style="flex:1;font-size:15px;background:var(--redbg);color:#B42318" data-a="delq" data-id="${esc(p.id)}">${ic('trash',20,{c:'#B42318',w:2})}${t('delete')}</button>`:`<button class="btn" style="flex:1.4;font-size:15px" data-a="repost" data-id="${esc(p.id)}">${ic('refresh',20,{c:'#fff',w:2})}${t('repost')}</button><button class="btn" style="flex:1;font-size:15px;background:var(--redbg);color:#B42318" data-a="delq" data-id="${esc(p.id)}">${ic('trash',20,{c:'#B42318',w:2})}${t('delete')}</button>`):`<button class="btn" data-a="contactSheet" data-id="${esc(p.id)}">${ic('phone',22,{c:'#fff'})}${t('contact_seller')}</button>`}</div></div>`}};
S('product_desc_demo','The product description appears here clearly and in detail, so the buyer knows everything they need before contacting the seller.','يظهر وصف المنتج هنا بشكل واضح ومفصّل ليعرف المشتري كل ما يحتاجه عن المنتج قبل التواصل مع البائع.');
S('notes_demo',"The seller's extra notes for the buyer appear here.",'ملاحظات البائع الإضافية للمشتري تظهر هنا.');

 return {nav:null,html:`<div class="pg">${hdr(e?t('edit_product'):t('post'))}

 <div class="note">${ic('sparkle',16)}${t('enhance')}</div>
 <div class="frm">${fld(t('product_name'),inp('F.name',t('product_name'),F.name))}
 ${fld(t('category'),selbtn('pickCat',F.cat?catn(F.cat):'',t('choose_cat'),'data-t="form"'))}
 <div class="frow">${fld(t('price'),inp('F.price',t('price'),F.price,'number'))}${fld(t('quantity'),inp('F.qty',t('quantity'),F.qty,'number'))}</div>
 <div class="frow">${fld(t('country'),selbtn('pickCountry',F.country?cname(F.country):'',t('choose_country'),'data-t="form"'))}${fld(t('gov'),selbtn('pickGov',gname,t('choose_gov'),'data-t="form"'))}</div>
 ${fld(t('desc'),area('F.desc',t('desc_ph'),F.desc,100))}${fld(t('notes'),area('F.notes',t('notes_ph'),F.notes,84))}
 ${e?'':`<div class="info">${ic('info',22)}<span>${t('contact_note')}</span></div>`}
 <button class="btn" style="margin-top:4px" data-a="${e?'saveEdit':'publish'}">${e?t('save_edits'):t('publish')}</button></div></div>`}};
SCREENS.done=p=>{const x=byId(p.id);return {nav:null,html:`<div class="pg"><div class="center" style="margin-top:150px"><div class="ring"><i>${ic('check',56,{c:'#fff',w:2.6})}</i></div><h2 style="margin-top:28px;font-size:24px">${t('published')}</h2><p>${t('published_d')}</p>
 <div class="minip" style="margin-top:22px"><div class="im">${imgOrIcon(x,28)}</div><div><div style="font-size:15px">${esc(pn(x))}</div><div style="font-size:16px;font-weight:800;color:var(--dark);margin:5px 0">${money(x.price)}</div><div class="cloc" style="margin:0">${ic('pin',14)}${esc(locFull(x))}</div></div></div></div>
 <div style="position:absolute;left:20px;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px"><button class="btn" data-a="viewNew" data-id="${esc(x.id)}">${t('view_product')}</button><button class="btn light" data-a="tab" data-v="home">${t('back_home')}</button></div></div>`}};
/* ---------- my products ---------- */
SCREENS.mine=()=>{let a=state.products.filter(p=>p.mine);if(state.mineTab==='active')a=a.filter(p=>p.status==='active');if(state.mineTab==='sold')a=a.filter(p=>p.status==='sold');a.sort((x,y)=>y.t-x.t);
 const row=p=>`<div class="mp"><div class="top" data-a="open" data-id="${esc(p.id)}"><div class="im">${imgOrIcon(p,30)}</div><div><div class="nm">${esc(pn(p))}</div><div class="pr">${money(p.price)}</div><div class="mt"><span class="l">${ic('pin',14,{c:'#6b7c74'})}${esc(locName(p))}</span><span class="pill ${p.status==='sold'?'g':''}">${p.status==='sold'?t('sold_s'):t('active')}</span></div></div></div>
 <div class="acts">${p.status==='active'?`<button class="dk" data-a="soldq" data-id="${esc(p.id)}">${ic('check',18,{c:'#fff',w:2})}${t('mark_sold')}</button><button data-a="editp" data-id="${esc(p.id)}">${ic('pen',18,{w:2})}${t('edit')}</button><button class="rd2" data-a="delq" data-id="${esc(p.id)}">${ic('trash',18,{c:'#B42318',w:2})}${t('delete')}</button>`:`<button class="dk" data-a="repost" data-id="${esc(p.id)}">${ic('refresh',18,{c:'#fff',w:2})}${t('repost')}</button><button class="rd2" data-a="delq" data-id="${esc(p.id)}">${ic('trash',18,{c:'#B42318',w:2})}${t('delete')}</button>`}</div></div>`;

 <div class="sgrp">${t('account')}</div><div class="srow"><span class="lb">${t('linked')}</span><span class="gbadge"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Google</span></div>
 ${R(t('del_account'),'','delAccq',true)}<div class="sgrp">${t('about_app')}</div>${R(t('privacy'),'','go:legalp')}${R(t('terms'),'','go:legalt')}<div class="srow"><span class="lb">${t('version')}</span><span class="v" dir="ltr">v1.0.0</span></div></div>`}};

 <div class="sec" style="margin-top:18px">${t('faq')}</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">${Q.map((q,i)=>`<button class="faq ${state.faqOpen===i?'on':''}" data-a="faq" data-v="${i}"><div class="q"><span>${t(q[0])}</span>${ic(state.faqOpen===i?'chevu':'chevd',18,{c:'#126B45',w:2.2})}</div>${state.faqOpen===i?`<div class="a">${t(q[1])}</div>`:''}</button>`).join('')}</div>

 return {nav:null,html:`<div class="pg">${hdr(g(d.title),{sub:t('last_updated')+': 2026/10/13'})}

/* ---------- pickers ---------- */
const LISTS={};
const pickWrap=(inner,foot,extra='')=>`<div class="pg" style="padding:0"><div class="pickwrap ${extra}">${inner}<div class="foot"><button class="btn" data-a="confirmPick">${foot}</button></div></div></div>`;
const searchBox=ph=>`<div class="srch" style="margin-top:14px;border-width:1px;color:var(--gray)">${ic('search',20,{w:2})}<input data-in="TMP.q" data-live="1" placeholder="${esc(ph)}" value="${esc(TMP.q||'')}" style="color:var(--ink)"></div>`;
function catList(){const q=(TMP.q||'').toLowerCase();return CATS.filter(c=>!q||(c.en+c.ar).toLowerCase().includes(q)).map(c=>`<button class="item ${TMP.cat===c.id?'on':''}" data-a="selCat" data-v="${c.id}"><span class="cic">${ic('c_'+c.id,20)}</span><span class="lb">${c[L()]}</span><span class="rd ${TMP.cat===c.id?'on':''}"></span></button>`).join('')}
SCREENS.pickCat=()=>{LISTS.pickCat=()=>$('#plist').innerHTML=catList();return {nav:null,html:pickWrap(`<div style="padding-top:0">${hdr(t('choose_cat'))}${searchBox(t('search_cats'))}</div><div class="scroll"><div class="lst" id="plist">${catList()}</div></div>`,t('confirm_sel'))}};
const flagHtml=iso=>{if(ASSETS[iso]&&['SA','LB','EG','AD','AF','IR','AL','CA','ES','CY','PT'].includes(iso))return `<span class="flag"><img src="${ASSETS[iso]}" alt=""></span>`;if(FLAGS[iso])return `<span class="flag"><svg viewBox="0 0 36 36">${FLAGS[iso]}</svg></span>`;return `<span class="flag">${iso}</span>`};
function ctryList(){const q=(TMP.q||'').toLowerCase();let a=COUNTRIES.filter(c=>!q||(c.en+' '+c.ar+' '+c.al).toLowerCase().includes(q));const ar=L()==='ar';
 const key=c=>ar?normAr(c.ar):c.en;a.sort((x,y)=>key(x).localeCompare(key(y),ar?'ar':'en'));
 const letter=c=>{const k=key(c)[0].toUpperCase();return k==='ا'?'أ':k};let out='',last='';

 case 'soon':case 'logoutConfirm':case 'delAccConfirm':closeOv();toast(t('soon'));break;

/* ---------- balance empty states ----------
   Empty/error blocks (no results, no favorites, no connection...) keep the 90px gap under a bare header (the Favorites look), but when the
   header is taller (search bar, chips, counters) they move up so the block's centre stays near 40% of the screen height instead of sitting low. */
(function(){const MIN=32,MAX=90;let q=0;
 function fit(){q=0;$$('#view .pg > .center').forEach(el=>{const st=el.getAttribute('style')||'';if(!el.querySelector(':scope > .bigc')||el.querySelector('.bigc > span'))return;if(!el.hasAttribute('data-bal')&&!/margin-top:\s*(210|150|120|90)px/.test(st))return;
  const pg=el.parentElement;el.style.marginTop='0px';const prev=el.offsetTop,h=el.offsetHeight,m=Math.round(Math.max(MIN,Math.min(MAX,.4*pg.clientHeight-h/2-prev)));el.style.marginTop=m+'px';el.setAttribute('data-bal','1')})}
 const go=()=>{if(!q)q=requestAnimationFrame(fit)};
 const v=document.getElementById('view');if(v)new MutationObserver(go).observe(v,{childList:true,subtree:true,attributes:true,attributeFilter:['style']});
